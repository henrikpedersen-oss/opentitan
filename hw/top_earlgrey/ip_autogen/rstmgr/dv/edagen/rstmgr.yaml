# edagen's configuration for rstmgr, the reset manager (top_earlgrey's, generated by ipgen from
# hw/ip_templates/rstmgr; eg2_top_verification: make block-flow BLOCK=rstmgr, which finds it under
# hw/top_earlgrey/ip_autogen/rstmgr; edagen is eg2_top_verification's scripts/edagen). It reuses
# rstmgr's block bench (dv/) with the reset manager reference model checking the RTL
# (env/rstmgr_cmodel_sb.sv, +rstmgr_cmodel=1; the model is hw/top_earlgrey/dv/eg2_model/ip/
# eg2_rstmgr_core.h), and generates the lint, CDC/RDC, reset, formal, synthesis and equivalence
# flows from rstmgr_rtl.f. Change the bench in hw/ip_templates/rstmgr/dv and regenerate; this
# directory is not generated.
module: rstmgr
clock_frequency_hz: 24_000_000
top: rstmgr
description: "rstmgr, the reset manager: its block bench, checked against the reset manager reference model"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  # rstmgr and its dependencies (TL-UL, primitives, the packages of its peers), from FuseSoC
  # (rstmgr_rtl.f says how). The simulation builds the RTL through DVSim; lint, formal and synthesis
  # read this list.
  filelist: rstmgr_rtl.f
  filelist_vars: {REPO: ../../../../../..}

# rstmgr.hjson "clocking" and top_earlgrey.gen.hjson's clock_srcs for rstmgr_aon: clk_i, clk_por_i
# and clk_io_div4_i are io_div4 (clk_i from the powerup group): one clock group. clk_io_div2_i and
# clk_io_i are io divided by 2 and io itself (the top's derived_srcs); rstmgr reaches them only
# through its leaf reset synchronizers, so they are separate groups here (2026-11-07: as one group,
# Genus timed the synchronizers' 24 MHz -> 96 MHz paths as same-domain paths, slack -8.5 ns). main,
# usb and aon are separate sources (the top's clocks.srcs): each its own group.
clocks:
  - {name: clk, port: clk_i}
  - {name: clk_por, port: clk_por_i, freq_hz: 24_000_000, group: clk}
  - {name: clk_io_div4, port: clk_io_div4_i, freq_hz: 24_000_000, group: clk}
  - {name: clk_io_div2, port: clk_io_div2_i, freq_hz: 48_000_000}
  - {name: clk_io, port: clk_io_i, freq_hz: 96_000_000}
  - {name: clk_main, port: clk_main_i, freq_hz: 100_000_000}
  - {name: clk_usb, port: clk_usb_i, freq_hz: 48_000_000}
  - {name: clk_aon, port: clk_aon_i, freq_hz: 200_000}

# top_earlgrey.gen.hjson reset_connections: rst_ni is the always-on lc_io_div4 reset, rst_por_ni the
# always-on por_io_div4 reset; scan_rst_ni the DFT scan reset (used with scanmode_i).
# por_n_i, the root of the reset tree (theory_of_operation.md "POR Reset Tree"), is a 2-bit port:
# edagen's resets take whole 1-bit ports and Jasper refuses a vector as a reset ("Illegal expression
# por_n_i", 2026-11-07). Until edagen takes a Jasper-only reset expression (formal.resets), the reset
# analysis does not reset the POR stretcher and the trees below it from por_n_i.
resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_por, port: rst_por_ni, active_low: true, sync_to: clk_por}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: rstmgr_ral_pkg
    ral_core: "lowrisc:earlgrey_dv:rstmgr_env:0.1"

# rstmgr.hjson's alerts.
alerts:
  - {name: fatal_fault, fatal: true, desc: "A fatal TL-UL bus integrity fault or a reset FSM/sparse fault"}
  - {name: fatal_cnsty_fault, fatal: true, desc: "A reset consistency fault"}

dv:
  lowrisc_root: ../../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/top_earlgrey/ip_autogen/rstmgr/dv/rstmgr_sim_cfg.hjson
  reuse_core: "lowrisc:earlgrey_dv:rstmgr_sim:0.1"
  reuse_testplan: hw/top_earlgrey/ip_autogen/rstmgr/data/rstmgr_testplan.hjson

# Jasper CDC/RDC: the clock domain of each port whose interface clock (clk_i) is wrong. por_n_i is
# the AST's power-ok, the root of the reset tree, filtered and stretched inside rstmgr on the aon
# clock (theory_of_operation.md "POR Reset Tree": "The filter acts as a synchronizer"): async.
# scanmode_i and scan_rst_ni come from DFT: async. cpu_dump_i comes from the core (main clock).
# resets_o are leaf resets in many clock domains (the top's reset nodes, each with its own clock)
# and rst_en_o their reset-active indications: not rated (none), CDC finds their domains from their
# synchronizers. pwr_i / pwr_o and alert_dump_i are io_div4 like clk_i.
formal:
  cdc_ports:
    por_n_i: async
    scanmode_i: async
    scan_rst_ni: async
    cpu_dump_i: clk_main
    resets_o: none
    rst_en_o: none

# Synthesis with NanGate45 (NANGATE45_DIR: eg2_top_verification sets it).
synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  # Superlint, UNR of the simulations' coverage holes, CDC/RDC (eight clocks, four groups), the
  # reset analysis, and FPV with the generated property stub.
  jasper: {apps: [superlint, unr, cdc, fpv, reset]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  # Yosys maps to its generic gates: its scripts cannot take NANGATE45_DIR.
  yosys: {frontend: slang, flatten: true}

# DVSim tests of rstmgr's bench: every test rstmgr_sim_cfg.hjson names, and the common CIP tests it
# imports (CSR, alert, TL-UL access, sec_cm, stress). The rstmgr_cmodel_* runs compare rstmgr with
# the reset manager reference model; the random one has no other checker.
# rstmgr_cmodel_random_inject_fail corrupts one prediction and must fail: not listed (edagen has no
# expected failure); run it with make block-flow BLOCK=rstmgr BLOCK_GOAL=sim
# TEST=rstmgr_cmodel_random_inject_fail.
tests:
  - {name: rstmgr_smoke, uvm_test: rstmgr_smoke, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_por_stretcher, uvm_test: rstmgr_por_stretcher, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_reset, uvm_test: rstmgr_reset, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_sw_rst_reset_race, uvm_test: rstmgr_sw_rst_reset_race, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_sw_rst, uvm_test: rstmgr_sw_rst, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_sec_cm_scan_intersig_mubi, uvm_test: rstmgr_sec_cm_scan_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: rstmgr_leaf_rst_cnsty, uvm_test: rstmgr_leaf_rst_cnsty, seeds: [1, 2, 3], timeout: 1800}
  - {name: rstmgr_leaf_rst_shadow_attack, uvm_test: rstmgr_leaf_rst_shadow_attack, seeds: [1], timeout: 1800}
  - {name: rstmgr_cmodel_smoke, uvm_test: rstmgr_cmodel_smoke, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_cmodel_reset, uvm_test: rstmgr_cmodel_reset, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_cmodel_random, uvm_test: rstmgr_cmodel_random, seeds: [1, 2, 3, 4, 5, 6, 7, 8], timeout: 3600}
  - {name: rstmgr_csr_hw_reset, uvm_test: rstmgr_csr_hw_reset, seeds: [1], timeout: 1800}
  - {name: rstmgr_csr_rw, uvm_test: rstmgr_csr_rw, seeds: [1], timeout: 1800}
  - {name: rstmgr_csr_bit_bash, uvm_test: rstmgr_csr_bit_bash, seeds: [1], timeout: 1800}
  - {name: rstmgr_csr_aliasing, uvm_test: rstmgr_csr_aliasing, seeds: [1], timeout: 1800}
  - {name: rstmgr_same_csr_outstanding, uvm_test: rstmgr_same_csr_outstanding, seeds: [1], timeout: 1800}
  - {name: rstmgr_csr_mem_rw_with_rand_reset, uvm_test: rstmgr_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 1800}
  - {name: rstmgr_alert_test, uvm_test: rstmgr_alert_test, seeds: [1], timeout: 1800}
  - {name: rstmgr_tl_errors, uvm_test: rstmgr_tl_errors, seeds: [1], timeout: 1800}
  - {name: rstmgr_tl_intg_err, uvm_test: rstmgr_tl_intg_err, seeds: [1], timeout: 1800}
  - {name: rstmgr_sec_cm, uvm_test: rstmgr_sec_cm, seeds: [1], timeout: 1800}
  - {name: rstmgr_stress_all, uvm_test: rstmgr_stress_all, seeds: [1, 2], timeout: 3600}
