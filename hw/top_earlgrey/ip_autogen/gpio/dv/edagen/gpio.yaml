# gpio: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: gpio
clock_frequency_hz: 24000000
top: gpio
description: "gpio: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: gpio_rtl.f
  filelist_vars: {REPO: ../../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: gpio_ral_pkg
    ral_core: "lowrisc:earlgrey_dv:gpio_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/top_earlgrey/ip_autogen/gpio/dv/gpio_sim_cfg.hjson
  reuse_core: "lowrisc:earlgrey_dv:gpio_sim:0.1"
  reuse_testplan: hw/top_earlgrey/ip_autogen/gpio/data/gpio_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: gpio_smoke, uvm_test: gpio_smoke, seeds: [1, 2], timeout: 3600}
  - {name: gpio_smoke_no_pullup_pulldown, uvm_test: gpio_smoke_no_pullup_pulldown, seeds: [1, 2], timeout: 3600}
  - {name: gpio_random_dout_din, uvm_test: gpio_random_dout_din, seeds: [1, 2], timeout: 3600}
  - {name: gpio_random_dout_din_no_pullup_pulldown, uvm_test: gpio_random_dout_din_no_pullup_pulldown, seeds: [1, 2], timeout: 3600}
  - {name: gpio_dout_din_regs_random_rw, uvm_test: gpio_dout_din_regs_random_rw, seeds: [1, 2], timeout: 3600}
  - {name: gpio_intr_rand_pgm, uvm_test: gpio_intr_rand_pgm, seeds: [1, 2], timeout: 3600}
  - {name: gpio_rand_intr_trigger, uvm_test: gpio_rand_intr_trigger, seeds: [1, 2], timeout: 3600}
  - {name: gpio_intr_with_filter_rand_intr_event, uvm_test: gpio_intr_with_filter_rand_intr_event, seeds: [1, 2], timeout: 3600}
  - {name: gpio_filter_stress, uvm_test: gpio_filter_stress, seeds: [1, 2], timeout: 3600}
  - {name: gpio_random_long_reg_writes_reg_reads, uvm_test: gpio_random_long_reg_writes_reg_reads, seeds: [1, 2], timeout: 3600}
  - {name: gpio_full_random, uvm_test: gpio_full_random, seeds: [1, 2], timeout: 3600}
  - {name: gpio_stress_all, uvm_test: gpio_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: gpio_stress_all_with_rand_reset, uvm_test: gpio_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: gpio_csr_rw, uvm_test: gpio_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: gpio_same_csr_outstanding, uvm_test: gpio_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: gpio_csr_aliasing, uvm_test: gpio_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: gpio_csr_mem_rw_with_rand_reset, uvm_test: gpio_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: gpio_tl_intg_err, uvm_test: gpio_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: gpio_smoke_en_cdc_prim, uvm_test: gpio_smoke_en_cdc_prim, seeds: [1, 2], timeout: 3600}
  - {name: gpio_smoke_no_pullup_pulldown_en_cdc_prim, uvm_test: gpio_smoke_no_pullup_pulldown_en_cdc_prim, seeds: [1, 2], timeout: 3600}
  - {name: gpio_rand_straps, uvm_test: gpio_rand_straps, seeds: [1, 2], timeout: 3600}
  - {name: gpio_csr_hw_reset, uvm_test: gpio_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: gpio_csr_bit_bash, uvm_test: gpio_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: gpio_alert_test, uvm_test: gpio_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: gpio_intr_test, uvm_test: gpio_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: gpio_tl_errors, uvm_test: gpio_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: gpio_sec_cm, uvm_test: gpio_sec_cm, seeds: [1, 2], timeout: 3600}
