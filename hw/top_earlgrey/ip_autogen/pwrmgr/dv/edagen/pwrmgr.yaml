# edagen's configuration for pwrmgr, the power manager (top_earlgrey's, generated by ipgen from
# hw/ip_templates/pwrmgr; eg2_top_verification: make block-flow BLOCK=pwrmgr, which finds it under
# hw/top_earlgrey/ip_autogen/pwrmgr; edagen is eg2_top_verification's scripts/edagen). It reuses
# pwrmgr's block bench (dv/) with the power manager reference model checking the RTL
# (env/pwrmgr_cmodel_sb.sv, +pwrmgr_cmodel=1; the model is hw/top_earlgrey/dv/eg2_model/ip/
# eg2_pwrmgr_core.h), and generates the lint, formal, synthesis and equivalence flows from
# pwrmgr_rtl.f. Change the bench in hw/ip_templates/pwrmgr/dv and regenerate; this directory is not
# generated.
module: pwrmgr
clock_frequency_hz: 100_000_000
top: pwrmgr
description: "pwrmgr, the power manager: its block bench, checked against the power manager reference model"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  # pwrmgr and its dependencies (TL-UL, primitives, the packages of its peers), from FuseSoC
  # (pwrmgr_rtl.f says how). The simulation builds the RTL through DVSim; lint, formal and synthesis
  # read this list.
  filelist: pwrmgr_rtl.f
  filelist_vars: {REPO: ../../../../../..}

# pwrmgr.hjson "clocking": the fast clock, the always-on slow clock, the life-cycle and the
# escalation clocks. The slow clock is the AON clock (200 kHz on the chip, asynchronous). The
# life-cycle and escalation clocks come from the same source as clk_i on the chip
# (earlgrey_pd_aon.sv: clk_io_div4_powerup for clk_i and clk_lc_i, clk_io_div4_secure for
# clk_esc_i): one clock group.
clocks:
  - {name: clk, port: clk_i}
  - {name: clk_slow, port: clk_slow_i, freq_hz: 200_000}
  - {name: clk_lc, port: clk_lc_i, freq_hz: 100_000_000, group: clk}
  - {name: clk_esc, port: clk_esc_i, freq_hz: 100_000_000, group: clk}

# rst_main_ni is the main power domain's reset (pwrmgr.hjson: a reset without its own clock); pwrmgr
# uses it on the slow clock (the main power glitch checks).
resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_main, port: rst_main_ni, active_low: true, sync_to: clk_slow}
  - {name: rst_slow, port: rst_slow_ni, active_low: true, sync_to: clk_slow}
  - {name: rst_lc, port: rst_lc_ni, active_low: true, sync_to: clk_lc}
  - {name: rst_esc, port: rst_esc_ni, active_low: true, sync_to: clk_esc}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: pwrmgr_ral_pkg
    ral_core: "lowrisc:earlgrey_dv:pwrmgr_env:0.1"

# pwrmgr.hjson's alert.
alerts:
  - {name: fatal_fault, fatal: true, desc: "A fatal TL-UL bus integrity fault, or an escalation clock timeout"}

dv:
  lowrisc_root: ../../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/top_earlgrey/ip_autogen/pwrmgr/dv/pwrmgr_sim_cfg.hjson
  reuse_core: "lowrisc:earlgrey_dv:pwrmgr_sim:0.1"
  reuse_testplan: hw/top_earlgrey/ip_autogen/pwrmgr/data/pwrmgr_testplan.hjson

# Jasper CDC/RDC: the clock domain of each port whose interface clock (clk_i) is wrong. Where the
# signals come from on the chip (top_earlgrey.gen.hjson): the AST and the core run on other clocks;
# the wake-ups and reset requests come from the always-on peripherals; lc_ctrl, otp_ctrl, the NVM
# controller, rom_ctrl, rstmgr's software reset and rv_dm's NDM request are other blocks' outputs.
# pwrmgr takes each of them through a synchronizer (theory_of_operation.md: two FSMs, "Specific
# request / acknowledge signals" between the clock domains), so they are rated async here, and CDC
# checks that every one of them is synchronized. The escalation receiver runs on clk_esc. The AST
# requests come from the slow FSM.
formal:
  cdc_ports:
    pwr_ast_i: async
    # Driven on the chip by blocks on clk_io_div4 (clkmgr, otp_ctrl, lc_ctrl, rstmgr), pwrmgr's own
    # clock source (earlgrey_pd_aon.sv, earlgrey_pd_main.sv): rated with clk_lc (2026-11-07, Jasper
    # CDC: the lc_ctrl inputs' CTL_NO_STBL errors went away).
    pwr_clk_i: clk_lc
    pwr_otp_i: clk_lc
    pwr_lc_i: clk_lc
    lc_hw_debug_en_i: clk_lc
    lc_dft_en_i: clk_lc
    sw_rst_req_i: clk_lc
    # The wake-up and reset request sources (aon_timer, sysrst_ctrl, pinmux, adc_ctrl, sensor_ctrl,
    # the I3C reset detectors) drive them from their clk_aon flops, the source of clk_slow_i.
    wakeups_i: clk_slow
    rstreqs_i: clk_slow
    # Truly asynchronous on the chip: clk_main (the core, the NVM controller, rom_ctrl, rv_dm).
    pwr_nvm_i: async
    pwr_cpu_i: async
    ndmreset_req_i: async
    rom_ctrl_i: async
    esc_rst_tx_i: clk_esc
    esc_rst_rx_o: clk_esc
    pwr_ast_o: clk_slow

# Synthesis with NanGate45 (NANGATE45_DIR: eg2_top_verification sets it).
synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  # Superlint, UNR of the simulations' coverage holes, CDC (the four clocks), and FPV with the
  # generated property stub.
  jasper: {apps: [superlint, unr, cdc, fpv, reset]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  # Yosys maps to its generic gates: its scripts cannot take NANGATE45_DIR.
  yosys: {frontend: slang, flatten: true}

# DVSim tests of pwrmgr's bench: every test pwrmgr_sim_cfg.hjson names, and the common CIP tests it
# imports (CSR, interrupt, TL-UL access, sec_cm, stress with rand reset). The pwrmgr_cmodel_* runs
# compare pwrmgr with the power manager reference model; the random one has no other checker.
# pwrmgr_cmodel_random_inject_fail corrupts one prediction and must fail: not listed (edagen has no
# expected failure); run it with make block-flow BLOCK=pwrmgr BLOCK_GOAL=sim
# TEST=pwrmgr_cmodel_random_inject_fail.
tests:
  - {name: pwrmgr_smoke, uvm_test: pwrmgr_smoke, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_reset, uvm_test: pwrmgr_reset, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_lowpower_wakeup_race, uvm_test: pwrmgr_lowpower_wakeup_race, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_wakeup, uvm_test: pwrmgr_wakeup, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_wakeup_reset, uvm_test: pwrmgr_wakeup_reset, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_repeat_wakeup_reset, uvm_test: pwrmgr_repeat_wakeup_reset, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_aborted_low_power, uvm_test: pwrmgr_aborted_low_power, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_sec_cm_lc_ctrl_intersig_mubi, uvm_test: pwrmgr_sec_cm_lc_ctrl_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: pwrmgr_sec_cm_rstmgr_intersig_mubi, uvm_test: pwrmgr_sec_cm_rstmgr_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: pwrmgr_esc_clk_rst_malfunc, uvm_test: pwrmgr_esc_clk_rst_malfunc, seeds: [1], timeout: 1800}
  - {name: pwrmgr_sec_cm_ctrl_config_regwen, uvm_test: pwrmgr_sec_cm_ctrl_config_regwen, seeds: [1], timeout: 1800}
  - {name: pwrmgr_global_esc, uvm_test: pwrmgr_global_esc, seeds: [1], timeout: 1800}
  - {name: pwrmgr_escalation_timeout, uvm_test: pwrmgr_escalation_timeout, seeds: [1], timeout: 1800}
  - {name: pwrmgr_glitch, uvm_test: pwrmgr_glitch, seeds: [1], timeout: 1800}
  - {name: pwrmgr_disable_rom_integrity_check, uvm_test: pwrmgr_disable_rom_integrity_check, seeds: [1], timeout: 1800}
  - {name: pwrmgr_reset_invalid, uvm_test: pwrmgr_reset_invalid, seeds: [1], timeout: 1800}
  - {name: pwrmgr_lowpower_invalid, uvm_test: pwrmgr_lowpower_invalid, seeds: [1], timeout: 1800}
  - {name: pwrmgr_cmodel_smoke, uvm_test: pwrmgr_cmodel_smoke, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_cmodel_random, uvm_test: pwrmgr_cmodel_random, seeds: [1, 2, 3, 4, 5, 6, 7, 8], timeout: 3600}
  - {name: pwrmgr_csr_hw_reset, uvm_test: pwrmgr_csr_hw_reset, seeds: [1], timeout: 1800}
  - {name: pwrmgr_csr_rw, uvm_test: pwrmgr_csr_rw, seeds: [1], timeout: 1800}
  - {name: pwrmgr_csr_bit_bash, uvm_test: pwrmgr_csr_bit_bash, seeds: [1], timeout: 1800}
  - {name: pwrmgr_csr_aliasing, uvm_test: pwrmgr_csr_aliasing, seeds: [1], timeout: 1800}
  - {name: pwrmgr_same_csr_outstanding, uvm_test: pwrmgr_same_csr_outstanding, seeds: [1], timeout: 1800}
  - {name: pwrmgr_csr_mem_rw_with_rand_reset, uvm_test: pwrmgr_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 1800}
  - {name: pwrmgr_intr_test, uvm_test: pwrmgr_intr_test, seeds: [1], timeout: 1800}
  - {name: pwrmgr_tl_errors, uvm_test: pwrmgr_tl_errors, seeds: [1], timeout: 1800}
  - {name: pwrmgr_tl_intg_err, uvm_test: pwrmgr_tl_intg_err, seeds: [1], timeout: 1800}
  - {name: pwrmgr_sec_cm, uvm_test: pwrmgr_sec_cm, seeds: [1], timeout: 1800}
  - {name: pwrmgr_stress_all, uvm_test: pwrmgr_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: pwrmgr_stress_all_with_rand_reset, uvm_test: pwrmgr_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
