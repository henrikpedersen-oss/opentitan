# edagen's configuration for alert_handler (top_earlgrey's, generated by ipgen from
# hw/ip_templates/alert_handler; eg2_top_verification: make block-flow BLOCK=alert_handler
# BLOCK_DIR=hw/top_earlgrey/ip_autogen/alert_handler; edagen is eg2_top_verification's
# scripts/edagen). It reuses alert_handler's block bench (dv/) with the alert handler reference model
# checking the RTL next to OpenTitan's scoreboard (env/alert_handler_cmodel_sb.sv,
# +alert_handler_cmodel=1; the model is hw/top_earlgrey/dv/eg2_model/ip/eg2_alert_core.h, shared with
# eg2sim), and generates the lint, formal, synthesis and equivalence flows from alert_handler_rtl.f.
# Change the bench in hw/ip_templates/alert_handler/dv and regenerate; this directory is not
# generated.
module: alert_handler
clock_frequency_hz: 24_000_000
top: alert_handler
description: "alert_handler, the alert handler: its block bench, checked against the alert handler reference model"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  # alert_handler and its dependencies, from FuseSoC (alert_handler_rtl.f says how). The simulation
  # builds the RTL through DVSim; lint, formal and synthesis read this list.
  filelist: alert_handler_rtl.f
  filelist_vars: {REPO: ../../../../../..}

# alert_handler.hjson "clocking": clk_i with rst_ni (and rst_shadowed_ni for the shadow copies), and
# the EDN clock clk_edn_i with rst_edn_ni. On the chip (top_earlgrey.hjson) the alert handler runs on
# clk_io_div4_secure and EDN0 on clk_main_secure: two asynchronous groups.
clocks:
  - {name: clk, port: clk_i}
  - {name: clk_edn, port: clk_edn_i, freq_hz: 100_000_000, group: clk_edn}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_shadowed, port: rst_shadowed_ni, active_low: true, sync_to: clk}
  - {name: rst_edn, port: rst_edn_ni, active_low: true, sync_to: clk_edn}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: alert_handler_ral_pkg
    ral_core: "lowrisc:earlgrey_dv:alert_handler_env:0.1"

# Jasper CDC/RDC: the clock domain of each port whose interface clock (clk_i) is wrong. The alert
# senders run on many clocks (alert_handler.hjson AsyncOn: an asynchronous channel is synchronized
# in the receiver), the low-power-group indications come from the clock and reset managers ("routed
# as multibit signals to the alert handler, where they are synchronized to the alert handler
# clock"), and the EDN interface is on clk_edn. The escalation receivers are on the alert handler's
# clock group on the chip.
formal:
  files: [formal/alert_handler_fpv_props.sv]
  cdc_ports:
    alert_tx_i: async
    lpg_cg_en_i: async
    lpg_rst_en_i: async
    edn_i: clk_edn
    edn_o: clk_edn

dv:
  lowrisc_root: ../../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/top_earlgrey/ip_autogen/alert_handler/dv/alert_handler_sim_cfg.hjson
  reuse_core: "lowrisc:earlgrey_dv:alert_handler_sim:0.1"
  reuse_testplan: hw/top_earlgrey/ip_autogen/alert_handler/data/alert_handler_testplan.hjson

# Synthesis with NanGate45 (NANGATE45_DIR: eg2_top_verification sets it).
synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv, reset]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  # Yosys maps to its generic gates: its scripts cannot take NANGATE45_DIR.
  yosys: {frontend: slang, flatten: true}

# DVSim tests of alert_handler's bench: OpenTitan's tests and the common CIP tests it imports, and the
# alert_handler_cmodel_* runs (the block against the reference model, with OpenTitan's sequences).
# alert_handler_cmodel_smoke_inject_fail corrupts one prediction and must fail: not listed (edagen has
# no expected failure); run it with make block-flow BLOCK=alert_handler BLOCK_GOAL=sim
# TEST=alert_handler_cmodel_smoke_inject_fail.
tests:
  - {name: alert_handler_smoke, uvm_test: alert_handler_smoke, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_random_alerts, uvm_test: alert_handler_random_alerts, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_random_classes, uvm_test: alert_handler_random_classes, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_esc_intr_timeout, uvm_test: alert_handler_esc_intr_timeout, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_esc_alert_accum, uvm_test: alert_handler_esc_alert_accum, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_sig_int_fail, uvm_test: alert_handler_sig_int_fail, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_entropy, uvm_test: alert_handler_entropy, seeds: [1], timeout: 3600}
  - {name: alert_handler_ping_timeout, uvm_test: alert_handler_ping_timeout, seeds: [1, 2], timeout: 3600}
  - {name: alert_handler_lpg, uvm_test: alert_handler_lpg, seeds: [1, 2], timeout: 3600}
  - {name: alert_handler_lpg_stub_clk, uvm_test: alert_handler_lpg_stub_clk, seeds: [1], timeout: 3600}
  - {name: alert_handler_entropy_stress, uvm_test: alert_handler_entropy_stress, seeds: [1], timeout: 1800}
  - {name: alert_handler_stress_all, uvm_test: alert_handler_stress_all, seeds: [1], timeout: 3600}
  - {name: alert_handler_shadow_reg_errors_with_csr_rw, uvm_test: alert_handler_shadow_reg_errors_with_csr_rw, seeds: [1], timeout: 3600}
  - {name: alert_handler_alert_accum_saturation, uvm_test: alert_handler_alert_accum_saturation, seeds: [1], timeout: 1800}
  - {name: alert_handler_cmodel_smoke, uvm_test: alert_handler_cmodel_smoke, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_cmodel_random_alerts, uvm_test: alert_handler_cmodel_random_alerts, seeds: [1, 2, 3, 4], timeout: 1800}
  - {name: alert_handler_cmodel_random_classes, uvm_test: alert_handler_cmodel_random_classes, seeds: [1, 2, 3, 4], timeout: 1800}
  - {name: alert_handler_cmodel_esc_intr_timeout, uvm_test: alert_handler_cmodel_esc_intr_timeout, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_cmodel_esc_alert_accum, uvm_test: alert_handler_cmodel_esc_alert_accum, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_cmodel_sig_int_fail, uvm_test: alert_handler_cmodel_sig_int_fail, seeds: [1, 2], timeout: 1800}
  - {name: alert_handler_cmodel_ping_timeout, uvm_test: alert_handler_cmodel_ping_timeout, seeds: [1, 2], timeout: 3600}
  - {name: alert_handler_cmodel_lpg, uvm_test: alert_handler_cmodel_lpg, seeds: [1, 2], timeout: 3600}
  - {name: alert_handler_csr_hw_reset, uvm_test: alert_handler_csr_hw_reset, seeds: [1], timeout: 1800}
  - {name: alert_handler_csr_rw, uvm_test: alert_handler_csr_rw, seeds: [1], timeout: 1800}
  - {name: alert_handler_csr_bit_bash, uvm_test: alert_handler_csr_bit_bash, seeds: [1], timeout: 1800}
  - {name: alert_handler_csr_aliasing, uvm_test: alert_handler_csr_aliasing, seeds: [1], timeout: 1800}
  - {name: alert_handler_same_csr_outstanding, uvm_test: alert_handler_same_csr_outstanding, seeds: [1], timeout: 1800}
  - {name: alert_handler_csr_mem_rw_with_rand_reset, uvm_test: alert_handler_csr_mem_rw_with_rand_reset, seeds: [1], timeout: 1800}
  - {name: alert_handler_intr_test, uvm_test: alert_handler_intr_test, seeds: [1], timeout: 1800}
  - {name: alert_handler_tl_errors, uvm_test: alert_handler_tl_errors, seeds: [1], timeout: 1800}
