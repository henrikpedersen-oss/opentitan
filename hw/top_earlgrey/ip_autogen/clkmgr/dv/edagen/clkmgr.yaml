# edagen's configuration for clkmgr, the clock manager (top_earlgrey's, generated by ipgen from
# hw/ip_templates/clkmgr; eg2_top_verification: make block-flow BLOCK=clkmgr, which finds it under
# hw/top_earlgrey/ip_autogen/clkmgr; edagen is eg2_top_verification's scripts/edagen). It reuses
# clkmgr's block bench (dv/) with the clock manager reference model checking the RTL
# (env/clkmgr_cmodel_sb.sv, +clkmgr_cmodel=1; the model is hw/top_earlgrey/dv/eg2_model/ip/
# eg2_clkmgr_core.h), and generates the lint, formal, synthesis and equivalence flows from
# clkmgr_rtl.f. Change the bench in hw/ip_templates/clkmgr/dv and regenerate; this directory is not
# generated.
module: clkmgr
clock_frequency_hz: 24_000_000
top: clkmgr
description: "clkmgr, the clock manager: its block bench, checked against the clock manager reference model"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  # clkmgr and its dependencies (TL-UL, primitives, the packages of its peers), from FuseSoC
  # (clkmgr_rtl.f says how). The simulation builds the RTL through DVSim; lint, formal and synthesis
  # read this list.
  filelist: clkmgr_rtl.f
  filelist_vars: {REPO: ../../../../../..}

# clkmgr.hjson "clocking": the register clock (io_div4, 24 MHz), the always-on clock and the three
# source clocks it gates and divides (top_earlgrey: main 100 MHz, io 96 MHz, usb 48 MHz).
clocks:
  - {name: clk, port: clk_i}
  - {name: clk_aon, port: clk_aon_i, freq_hz: 200_000}
  - {name: clk_io, port: clk_io_i, freq_hz: 96_000_000}
  - {name: clk_main, port: clk_main_i, freq_hz: 100_000_000}
  - {name: clk_usb, port: clk_usb_i, freq_hz: 48_000_000}

# The life-cycle resets of each domain, the shadowed-register reset, and the por resets of the root
# clocks and dividers (theory_of_operation.md "Reset Domains"). io_div2 / io_div4 are clkmgr's own
# divided clocks: their resets are taken on the io clock here.
resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_shadowed, port: rst_shadowed_ni, active_low: true, sync_to: clk}
  - {name: rst_aon, port: rst_aon_ni, active_low: true, sync_to: clk_aon}
  - {name: rst_io, port: rst_io_ni, active_low: true, sync_to: clk_io}
  - {name: rst_main, port: rst_main_ni, active_low: true, sync_to: clk_main}
  - {name: rst_usb, port: rst_usb_ni, active_low: true, sync_to: clk_usb}
  - {name: rst_io_div2, port: rst_io_div2_ni, active_low: true, sync_to: clk_io}
  - {name: rst_io_div4, port: rst_io_div4_ni, active_low: true, sync_to: clk_io}
  - {name: rst_root, port: rst_root_ni, active_low: true, sync_to: clk}
  - {name: rst_root_main, port: rst_root_main_ni, active_low: true, sync_to: clk_main}
  - {name: rst_root_io, port: rst_root_io_ni, active_low: true, sync_to: clk_io}
  - {name: rst_root_io_div2, port: rst_root_io_div2_ni, active_low: true, sync_to: clk_io}
  - {name: rst_root_io_div4, port: rst_root_io_div4_ni, active_low: true, sync_to: clk_io}
  - {name: rst_root_usb, port: rst_root_usb_ni, active_low: true, sync_to: clk_usb}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: clkmgr_ral_pkg
    ral_core: "lowrisc:earlgrey_dv:clkmgr_env:0.1"

# clkmgr.hjson's alerts.
alerts:
  - {name: recov_fault, fatal: false, desc: "Measurement errors and shadowed-register update errors"}
  - {name: fatal_fault, fatal: true, desc: "A fatal TL-UL bus integrity fault, an idle counter fault or a shadow storage error"}

dv:
  lowrisc_root: ../../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/top_earlgrey/ip_autogen/clkmgr/dv/clkmgr_sim_cfg.hjson
  reuse_core: "lowrisc:earlgrey_dv:clkmgr_sim:0.1"
  reuse_testplan: hw/top_earlgrey/ip_autogen/clkmgr/data/clkmgr_testplan.hjson

# Jasper only: the FPV environment holds scan mode off (clkmgr_fpv_env.sv).
formal:
  files: [formal/clkmgr_fpv_env.sv]
  # FPV clock ratios (Jasper clock -factor): the measurement units count measured-clock edges per
  # always-on period and synchronize pulses between the domains, so the always-on reference has to
  # be slower than every measured clock (the 9 counterexamples of 2026-11-07 came from equal clocks).
  # Small factors, not the real 500:1, so the proofs stay shallow; usb (48 MHz) half the io/main rate.
  clock_factors: {clk_aon: 8, clk_usb: 2}

# Synthesis with NanGate45 (NANGATE45_DIR: eg2_top_verification sets it).
synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  # Superlint, UNR of the simulations' coverage holes, CDC (the five clocks), and FPV with the
  # generated property stub.
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  # Yosys maps to its generic gates: its scripts cannot take NANGATE45_DIR.
  yosys: {frontend: slang, flatten: true}

# DVSim tests of clkmgr's bench: every test clkmgr_sim_cfg.hjson names, and the common CIP tests it
# imports (CSR, alert, TL-UL access, sec_cm, stress with rand reset, shadowed-register errors). The
# clkmgr_cmodel_* runs compare clkmgr with the clock manager reference model; the random one has no
# other checker. clkmgr_cmodel_random_inject_fail (one prediction corrupted) and
# clkmgr_cmodel_random_mutate_jitter / _mutate_hints (a mutated model) must fail: not listed (edagen
# has no expected failure); run them with make block-flow BLOCK=clkmgr BLOCK_GOAL=sim TEST=<name>.
tests:
  - {name: clkmgr_smoke, uvm_test: clkmgr_smoke, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_extclk, uvm_test: clkmgr_extclk, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_frequency, uvm_test: clkmgr_frequency, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_frequency_timeout, uvm_test: clkmgr_frequency_timeout, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_peri, uvm_test: clkmgr_peri, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_trans, uvm_test: clkmgr_trans, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_clk_status, uvm_test: clkmgr_clk_status, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_idle_intersig_mubi, uvm_test: clkmgr_idle_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: clkmgr_lc_ctrl_intersig_mubi, uvm_test: clkmgr_lc_ctrl_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: clkmgr_lc_clk_byp_req_intersig_mubi, uvm_test: clkmgr_lc_clk_byp_req_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: clkmgr_clk_handshake_intersig_mubi, uvm_test: clkmgr_clk_handshake_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: clkmgr_div_intersig_mubi, uvm_test: clkmgr_div_intersig_mubi, seeds: [1], timeout: 1800}
  - {name: clkmgr_regwen, uvm_test: clkmgr_regwen, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_smoke, uvm_test: clkmgr_cmodel_smoke, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_trans, uvm_test: clkmgr_cmodel_trans, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_peri, uvm_test: clkmgr_cmodel_peri, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_extclk, uvm_test: clkmgr_cmodel_extclk, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_frequency, uvm_test: clkmgr_cmodel_frequency, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_cmodel_random, uvm_test: clkmgr_cmodel_random, seeds: [1, 2, 3, 4, 5, 6, 7, 8], timeout: 3600}
  - {name: clkmgr_csr_hw_reset, uvm_test: clkmgr_csr_hw_reset, seeds: [1], timeout: 1800}
  - {name: clkmgr_csr_rw, uvm_test: clkmgr_csr_rw, seeds: [1], timeout: 1800}
  - {name: clkmgr_csr_bit_bash, uvm_test: clkmgr_csr_bit_bash, seeds: [1], timeout: 1800}
  - {name: clkmgr_csr_aliasing, uvm_test: clkmgr_csr_aliasing, seeds: [1], timeout: 1800}
  - {name: clkmgr_same_csr_outstanding, uvm_test: clkmgr_same_csr_outstanding, seeds: [1], timeout: 1800}
  - {name: clkmgr_csr_mem_rw_with_rand_reset, uvm_test: clkmgr_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 1800}
  - {name: clkmgr_alert_test, uvm_test: clkmgr_alert_test, seeds: [1], timeout: 1800}
  - {name: clkmgr_tl_errors, uvm_test: clkmgr_tl_errors, seeds: [1], timeout: 1800}
  - {name: clkmgr_tl_intg_err, uvm_test: clkmgr_tl_intg_err, seeds: [1], timeout: 1800}
  - {name: clkmgr_sec_cm, uvm_test: clkmgr_sec_cm, seeds: [1], timeout: 1800}
  - {name: clkmgr_shadow_reg_errors, uvm_test: clkmgr_shadow_reg_errors, seeds: [1], timeout: 1800}
  - {name: clkmgr_shadow_reg_errors_with_csr_rw, uvm_test: clkmgr_shadow_reg_errors_with_csr_rw, seeds: [1], timeout: 1800}
  - {name: clkmgr_stress_all, uvm_test: clkmgr_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: clkmgr_stress_all_with_rand_reset, uvm_test: clkmgr_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
