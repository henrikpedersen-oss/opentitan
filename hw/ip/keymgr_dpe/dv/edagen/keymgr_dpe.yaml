# keymgr_dpe: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: keymgr_dpe
clock_frequency_hz: 100000000
top: keymgr_dpe
description: "keymgr_dpe: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: keymgr_dpe_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: main}
  - {name: clk_edn, port: clk_edn_i, freq_hz: 100000000, group: main}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_edn, port: rst_edn_ni, active_low: true, sync_to: clk_edn}
  - {name: rst_shadowed, port: rst_shadowed_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: keymgr_dpe_ral_pkg
    ral_core: "lowrisc:dv:keymgr_dpe_env:0.1"

alerts:
  - {name: recov_operation_err, fatal: false, desc: "Alert for key manager operation errors. These errors could have been caused by software"}
  - {name: fatal_fault_err, fatal: true, desc: "Alert for key manager faults. These errors cannot be caused by software"}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/keymgr_dpe/dv/keymgr_dpe_sim_cfg.hjson
  reuse_core: "lowrisc:dv:keymgr_dpe_sim:0.1"
  reuse_testplan: hw/ip/keymgr_dpe/data/keymgr_dpe_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: keymgr_dpe_smoke, uvm_test: keymgr_dpe_smoke, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_csr_hw_reset, uvm_test: keymgr_dpe_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_csr_rw, uvm_test: keymgr_dpe_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_csr_bit_bash, uvm_test: keymgr_dpe_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_csr_aliasing, uvm_test: keymgr_dpe_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_same_csr_outstanding, uvm_test: keymgr_dpe_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_csr_mem_rw_with_rand_reset, uvm_test: keymgr_dpe_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_intr_test, uvm_test: keymgr_dpe_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_alert_test, uvm_test: keymgr_dpe_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_tl_errors, uvm_test: keymgr_dpe_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_tl_intg_err, uvm_test: keymgr_dpe_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_shadow_reg_errors, uvm_test: keymgr_dpe_shadow_reg_errors, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_shadow_reg_errors_with_csr_rw, uvm_test: keymgr_dpe_shadow_reg_errors_with_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: keymgr_dpe_sec_cm, uvm_test: keymgr_dpe_sec_cm, seeds: [1, 2], timeout: 3600}
