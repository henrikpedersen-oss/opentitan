# rom_ctrl: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: rom_ctrl
clock_frequency_hz: 100000000
top: rom_ctrl
description: "rom_ctrl: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: rom_ctrl_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: main}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: regs_tl_i, d2h: regs_tl_o}
    vip: lowrisc
    ral_package: rom_ctrl_regs_ral_pkg
    ral_core: "lowrisc:dv:rom_ctrl_env:0.1"
  - name: rom
    kind: tl
    ports: {h2d: rom_tl_i, d2h: rom_tl_o}
    vip: lowrisc
    ral_package: rom_ctrl_rom_ral_pkg
    ral_core: "lowrisc:dv:rom_ctrl_env:0.1"

alerts:
  - {name: fatal, fatal: true, desc: "A fatal error. Fatal alerts are non-recoverable and will be asserted until a hard reset."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/rom_ctrl/dv/rom_ctrl_192kB_sim_cfg.hjson
  reuse_core: "lowrisc:dv:rom_ctrl_sim:0.1"
  reuse_testplan: hw/ip/rom_ctrl/data/rom_ctrl_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: rom_ctrl_smoke, uvm_test: rom_ctrl_smoke, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_stress_all, uvm_test: rom_ctrl_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_max_throughput_chk, uvm_test: rom_ctrl_max_throughput_chk, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_corrupt_sig_fatal_chk, uvm_test: rom_ctrl_corrupt_sig_fatal_chk, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_kmac_err_chk, uvm_test: rom_ctrl_kmac_err_chk, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_csr_hw_reset, uvm_test: rom_ctrl_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_csr_rw, uvm_test: rom_ctrl_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_csr_bit_bash, uvm_test: rom_ctrl_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_csr_aliasing, uvm_test: rom_ctrl_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_same_csr_outstanding, uvm_test: rom_ctrl_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_csr_mem_rw_with_rand_reset, uvm_test: rom_ctrl_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_mem_walk, uvm_test: rom_ctrl_mem_walk, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_mem_partial_access, uvm_test: rom_ctrl_mem_partial_access, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_alert_test, uvm_test: rom_ctrl_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_tl_errors, uvm_test: rom_ctrl_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_tl_intg_err, uvm_test: rom_ctrl_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_passthru_mem_tl_intg_err, uvm_test: rom_ctrl_passthru_mem_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_sec_cm, uvm_test: rom_ctrl_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: rom_ctrl_stress_all_with_rand_reset, uvm_test: rom_ctrl_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
