# uart: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: uart
clock_frequency_hz: 24000000
top: uart
description: "uart: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: uart_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: uart_ral_pkg
    ral_core: "lowrisc:dv:uart_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/uart/dv/uart_sim_cfg.hjson
  reuse_core: "lowrisc:dv:uart_sim:0.1"
  reuse_testplan: hw/ip/uart/data/uart_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: uart_smoke, uvm_test: uart_smoke, seeds: [1, 2], timeout: 3600}
  - {name: uart_tx_rx, uvm_test: uart_tx_rx, seeds: [1, 2], timeout: 3600}
  - {name: uart_fifo_full, uvm_test: uart_fifo_full, seeds: [1, 2], timeout: 3600}
  - {name: uart_fifo_overflow, uvm_test: uart_fifo_overflow, seeds: [1, 2], timeout: 3600}
  - {name: uart_fifo_reset, uvm_test: uart_fifo_reset, seeds: [1, 2], timeout: 3600}
  - {name: uart_rx_oversample, uvm_test: uart_rx_oversample, seeds: [1, 2], timeout: 3600}
  - {name: uart_intr, uvm_test: uart_intr, seeds: [1, 2], timeout: 3600}
  - {name: uart_noise_filter, uvm_test: uart_noise_filter, seeds: [1, 2], timeout: 3600}
  - {name: uart_rx_start_bit_filter, uvm_test: uart_rx_start_bit_filter, seeds: [1, 2], timeout: 3600}
  - {name: uart_rx_parity_err, uvm_test: uart_rx_parity_err, seeds: [1, 2], timeout: 3600}
  - {name: uart_tx_ovrd, uvm_test: uart_tx_ovrd, seeds: [1, 2], timeout: 3600}
  - {name: uart_loopback, uvm_test: uart_loopback, seeds: [1, 2], timeout: 3600}
  - {name: uart_perf, uvm_test: uart_perf, seeds: [1, 2], timeout: 3600}
  - {name: uart_long_xfer_wo_dly, uvm_test: uart_long_xfer_wo_dly, seeds: [1, 2], timeout: 3600}
  - {name: uart_stress_all_with_rand_reset, uvm_test: uart_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: uart_csr_hw_reset, uvm_test: uart_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: uart_csr_rw, uvm_test: uart_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: uart_csr_bit_bash, uvm_test: uart_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: uart_csr_aliasing, uvm_test: uart_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: uart_same_csr_outstanding, uvm_test: uart_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: uart_csr_mem_rw_with_rand_reset, uvm_test: uart_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: uart_alert_test, uvm_test: uart_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: uart_intr_test, uvm_test: uart_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: uart_tl_errors, uvm_test: uart_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: uart_tl_intg_err, uvm_test: uart_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: uart_sec_cm, uvm_test: uart_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: uart_stress_all, uvm_test: uart_stress_all, seeds: [1, 2], timeout: 3600}
