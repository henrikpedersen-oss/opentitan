# rram_ctrl: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: rram_ctrl
clock_frequency_hz: 100000000
top: rram_ctrl
description: "rram_ctrl: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: rram_ctrl_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: main}
  - {name: clk_otp, port: clk_otp_i, freq_hz: 24000000, group: io_div4}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_otp, port: rst_otp_ni, active_low: true, sync_to: clk_otp}

interfaces:
  - name: core
    kind: tl
    ports: {h2d: core_tl_i, d2h: core_tl_o}
    vip: lowrisc
    ral_package: rram_ctrl_core_ral_pkg
    ral_core: "lowrisc:dv:rram_ctrl_env:0.1"
  - name: host
    kind: tl
    ports: {h2d: host_tl_i, d2h: host_tl_o}
    vip: lowrisc
    ral_package: rram_ctrl_host_ral_pkg
    ral_core: "lowrisc:dv:rram_ctrl_env:0.1"

alerts:
  - {name: recov_err, fatal: false, desc: "RRAM recoverable errors. Fired whenever a software initiated controller operation completes with any bit set in !!ERR_CO"}
  - {name: fatal_std_err, fatal: true, desc: "RRAM standard fatal errors. Fired whenever any bit in !!STD_FAULT_STATUS is set."}
  - {name: fatal_err, fatal: true, desc: "RRAM fatal errors. Fired whenever any bit in !!FAULT_STATUS is set, including uncorrectable ECC errors. Note that this a"}
  - {name: fatal_macro_err, fatal: true, desc: "Fatal errors triggered inside the RRAM macro, including fatal TL-UL bus integrity faults of the test interface."}
  - {name: recov_macro_err, fatal: false, desc: "Recoverable errors triggered inside the RRAM macro."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/rram_ctrl/dv/rram_ctrl_sim_cfg.hjson
  reuse_core: "lowrisc:dv:rram_ctrl_sim:0.1"
  reuse_testplan: hw/ip/rram_ctrl/data/rram_ctrl_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: rram_ctrl_smoke, uvm_test: rram_ctrl_smoke, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_csr_hw_reset, uvm_test: rram_ctrl_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_csr_rw, uvm_test: rram_ctrl_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_csr_bit_bash, uvm_test: rram_ctrl_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_csr_aliasing, uvm_test: rram_ctrl_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_same_csr_outstanding, uvm_test: rram_ctrl_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_csr_mem_rw_with_rand_reset, uvm_test: rram_ctrl_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_mem_walk, uvm_test: rram_ctrl_mem_walk, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_mem_partial_access, uvm_test: rram_ctrl_mem_partial_access, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_intr_test, uvm_test: rram_ctrl_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_alert_test, uvm_test: rram_ctrl_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_tl_errors, uvm_test: rram_ctrl_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_tl_intg_err, uvm_test: rram_ctrl_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_stress_all_with_rand_reset, uvm_test: rram_ctrl_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: rram_ctrl_stress_all, uvm_test: rram_ctrl_stress_all, seeds: [1, 2], timeout: 3600}
