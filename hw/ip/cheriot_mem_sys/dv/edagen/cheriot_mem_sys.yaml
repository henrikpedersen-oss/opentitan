# cheriot_mem_sys: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: cheriot_mem_sys
clock_frequency_hz: 100000000
top: cheriot_mem_sys
description: "cheriot_mem_sys: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: cheriot_mem_sys_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: main}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: regs_tl_d_i, d2h: regs_tl_d_o}
    vip: lowrisc
    ral_package: cheriot_mem_sys_regs_ral_pkg
    ral_core: "lowrisc:dv:cheriot_mem_sys_env:0.1"
  - name: revbm
    kind: tl
    ports: {h2d: revbm_tl_d_i, d2h: revbm_tl_d_o}
    vip: lowrisc
    ral_package: cheriot_mem_sys_revbm_ral_pkg
    ral_core: "lowrisc:dv:cheriot_mem_sys_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when an integrity fault is detected, when the meta SRAM path returns a device error, when "}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/cheriot_mem_sys/dv/cheriot_mem_sys_sim_cfg.hjson
  reuse_core: "lowrisc:dv:cheriot_mem_sys_sim:0.1"
  reuse_testplan: hw/ip/cheriot_mem_sys/data/cheriot_mem_sys_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: cheriot_mem_sys_smoke, uvm_test: cheriot_mem_sys_smoke, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_csr_hw_reset, uvm_test: cheriot_mem_sys_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_csr_rw, uvm_test: cheriot_mem_sys_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_csr_bit_bash, uvm_test: cheriot_mem_sys_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_csr_aliasing, uvm_test: cheriot_mem_sys_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_same_csr_outstanding, uvm_test: cheriot_mem_sys_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_csr_mem_rw_with_rand_reset, uvm_test: cheriot_mem_sys_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_alert_test, uvm_test: cheriot_mem_sys_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_intr_test, uvm_test: cheriot_mem_sys_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_tl_errors, uvm_test: cheriot_mem_sys_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: cheriot_mem_sys_tl_intg_err, uvm_test: cheriot_mem_sys_tl_intg_err, seeds: [1, 2], timeout: 3600}
