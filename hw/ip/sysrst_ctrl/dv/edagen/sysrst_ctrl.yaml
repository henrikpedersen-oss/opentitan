# sysrst_ctrl: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: sysrst_ctrl
clock_frequency_hz: 24000000
top: sysrst_ctrl
description: "sysrst_ctrl: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: sysrst_ctrl_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}
  - {name: clk_aon, port: clk_aon_i, freq_hz: 200000, group: aon}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_aon, port: rst_aon_ni, active_low: true, sync_to: clk_aon}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: sysrst_ctrl_ral_pkg
    ral_core: "lowrisc:dv:sysrst_ctrl_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/sysrst_ctrl/dv/sysrst_ctrl_sim_cfg.hjson
  reuse_core: "lowrisc:dv:sysrst_ctrl_sim:0.1"
  reuse_testplan: hw/ip/sysrst_ctrl/data/sysrst_ctrl_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: sysrst_ctrl_smoke, uvm_test: sysrst_ctrl_smoke, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_in_out_inverted, uvm_test: sysrst_ctrl_in_out_inverted, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_combo_detect_ec_rst, uvm_test: sysrst_ctrl_combo_detect_ec_rst, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_combo_detect_ec_rst_with_pre_cond, uvm_test: sysrst_ctrl_combo_detect_ec_rst_with_pre_cond, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_pin_access_test, uvm_test: sysrst_ctrl_pin_access_test, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_pin_override_test, uvm_test: sysrst_ctrl_pin_override_test, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_flash_wr_prot_out, uvm_test: sysrst_ctrl_flash_wr_prot_out, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_ec_pwr_on_rst, uvm_test: sysrst_ctrl_ec_pwr_on_rst, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_auto_blk_key_output, uvm_test: sysrst_ctrl_auto_blk_key_output, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_ultra_low_pwr, uvm_test: sysrst_ctrl_ultra_low_pwr, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_combo_detect, uvm_test: sysrst_ctrl_combo_detect, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_edge_detect, uvm_test: sysrst_ctrl_edge_detect, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_combo_detect_with_pre_cond, uvm_test: sysrst_ctrl_combo_detect_with_pre_cond, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_feature_disable, uvm_test: sysrst_ctrl_feature_disable, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_csr_hw_reset, uvm_test: sysrst_ctrl_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_csr_rw, uvm_test: sysrst_ctrl_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_csr_bit_bash, uvm_test: sysrst_ctrl_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_csr_aliasing, uvm_test: sysrst_ctrl_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_same_csr_outstanding, uvm_test: sysrst_ctrl_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_csr_mem_rw_with_rand_reset, uvm_test: sysrst_ctrl_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_intr_test, uvm_test: sysrst_ctrl_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_alert_test, uvm_test: sysrst_ctrl_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_tl_errors, uvm_test: sysrst_ctrl_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_tl_intg_err, uvm_test: sysrst_ctrl_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_sec_cm, uvm_test: sysrst_ctrl_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_stress_all_with_rand_reset, uvm_test: sysrst_ctrl_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: sysrst_ctrl_stress_all, uvm_test: sysrst_ctrl_stress_all, seeds: [1, 2], timeout: 3600}
