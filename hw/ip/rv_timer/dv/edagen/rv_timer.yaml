# rv_timer: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: rv_timer
clock_frequency_hz: 24000000
top: rv_timer
description: "rv_timer: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: rv_timer_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: rv_timer_ral_pkg
    ral_core: "lowrisc:dv:rv_timer_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected inside the RV_TIMER unit."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/rv_timer/dv/rv_timer_sim_cfg.hjson
  reuse_core: "lowrisc:dv:rv_timer_sim:0.1"
  reuse_testplan: hw/ip/rv_timer/data/rv_timer_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: rv_timer_random, uvm_test: rv_timer_random, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_min, uvm_test: rv_timer_min, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_max, uvm_test: rv_timer_max, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_disabled, uvm_test: rv_timer_disabled, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_cfg_update_on_fly, uvm_test: rv_timer_cfg_update_on_fly, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_random_reset, uvm_test: rv_timer_random_reset, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_csr_hw_reset, uvm_test: rv_timer_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_csr_rw, uvm_test: rv_timer_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_csr_bit_bash, uvm_test: rv_timer_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_csr_aliasing, uvm_test: rv_timer_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_same_csr_outstanding, uvm_test: rv_timer_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_csr_mem_rw_with_rand_reset, uvm_test: rv_timer_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_alert_test, uvm_test: rv_timer_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_intr_test, uvm_test: rv_timer_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_tl_errors, uvm_test: rv_timer_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_tl_intg_err, uvm_test: rv_timer_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_sec_cm, uvm_test: rv_timer_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_stress_all_with_rand_reset, uvm_test: rv_timer_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: rv_timer_stress_all, uvm_test: rv_timer_stress_all, seeds: [1, 2], timeout: 3600}
