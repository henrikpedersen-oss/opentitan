# spi_host: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: spi_host
clock_frequency_hz: 96000000
top: spi_host
description: "spi_host: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: spi_host_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: spi_host_ral_pkg
    ral_core: "lowrisc:dv:spi_host_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/spi_host/dv/spi_host_sim_cfg.hjson
  reuse_core: "lowrisc:dv:spi_host_sim:1.0"
  reuse_testplan: hw/ip/spi_host/data/spi_host_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: spi_host_smoke, uvm_test: spi_host_smoke, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_speed, uvm_test: spi_host_speed, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_upper_range_clkdiv, uvm_test: spi_host_upper_range_clkdiv, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_performance, uvm_test: spi_host_performance, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_sw_reset, uvm_test: spi_host_sw_reset, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_overflow_underflow, uvm_test: spi_host_overflow_underflow, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_error_cmd, uvm_test: spi_host_error_cmd, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_event, uvm_test: spi_host_event, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_passthrough_mode, uvm_test: spi_host_passthrough_mode, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_status_stall, uvm_test: spi_host_status_stall, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_idlecsbactive, uvm_test: spi_host_idlecsbactive, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_stress_all, uvm_test: spi_host_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_spien, uvm_test: spi_host_spien, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_csr_hw_reset, uvm_test: spi_host_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_csr_rw, uvm_test: spi_host_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_csr_bit_bash, uvm_test: spi_host_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_csr_aliasing, uvm_test: spi_host_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_same_csr_outstanding, uvm_test: spi_host_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_csr_mem_rw_with_rand_reset, uvm_test: spi_host_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_intr_test, uvm_test: spi_host_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_mem_walk, uvm_test: spi_host_mem_walk, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_mem_partial_access, uvm_test: spi_host_mem_partial_access, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_alert_test, uvm_test: spi_host_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_sec_cm, uvm_test: spi_host_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_tl_errors, uvm_test: spi_host_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: spi_host_tl_intg_err, uvm_test: spi_host_tl_intg_err, seeds: [1, 2], timeout: 3600}
