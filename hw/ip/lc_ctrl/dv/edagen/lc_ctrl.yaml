# lc_ctrl: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: lc_ctrl
clock_frequency_hz: 24000000
top: lc_ctrl
description: "lc_ctrl: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: lc_ctrl_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}
  - {name: clk_kmac, port: clk_kmac_i, freq_hz: 100000000, group: main}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}
  - {name: rst_kmac, port: rst_kmac_ni, active_low: true, sync_to: clk_kmac}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: regs_tl_i, d2h: regs_tl_o}
    vip: lowrisc
    ral_package: lc_ctrl_regs_ral_pkg
    ral_core: "lowrisc:dv:lc_ctrl_env:0.1"
  - name: dmi
    kind: tl
    ports: {h2d: dmi_tl_i, d2h: dmi_tl_o}
    vip: lowrisc
    ral_package: lc_ctrl_dmi_ral_pkg
    ral_core: "lowrisc:dv:lc_ctrl_env:0.1"

alerts:
  - {name: fatal_prog_error, fatal: true, desc: "This alert triggers if an error occurred during an OTP programming operation."}
  - {name: fatal_state_error, fatal: true, desc: "This alert triggers if an error in the life cycle state or life cycle controller FSM is detected."}
  - {name: fatal_bus_integ_error, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/lc_ctrl/dv/lc_ctrl_base_sim_cfg.hjson
  reuse_core: "lowrisc:dv:lc_ctrl_sim:0.1"
  reuse_testplan: hw/ip/lc_ctrl/data/lc_ctrl_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: lc_ctrl_smoke, uvm_test: lc_ctrl_smoke, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_volatile_unlock_smoke, uvm_test: lc_ctrl_volatile_unlock_smoke, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_state_failure, uvm_test: lc_ctrl_state_failure, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_state_post_trans, uvm_test: lc_ctrl_state_post_trans, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_prog_failure, uvm_test: lc_ctrl_prog_failure, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_errors, uvm_test: lc_ctrl_errors, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_security_escalation, uvm_test: lc_ctrl_security_escalation, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_regwen_during_op, uvm_test: lc_ctrl_regwen_during_op, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_claim_transition_if, uvm_test: lc_ctrl_claim_transition_if, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_smoke, uvm_test: lc_ctrl_jtag_smoke, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_state_failure, uvm_test: lc_ctrl_jtag_state_failure, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_state_post_trans, uvm_test: lc_ctrl_jtag_state_post_trans, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_prog_failure, uvm_test: lc_ctrl_jtag_prog_failure, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_errors, uvm_test: lc_ctrl_jtag_errors, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_access, uvm_test: lc_ctrl_jtag_access, seeds: [1, 2], timeout: 3600}
  - {name: lc_ctrl_jtag_priority, uvm_test: lc_ctrl_jtag_priority, seeds: [1, 2], timeout: 3600}
