  - {name: spi_device_alert_test, uvm_test: spi_device_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: spi_device_intr_test, uvm_test: spi_device_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: spi_device_tl_errors, uvm_test: spi_device_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: spi_device_tl_intg_err, uvm_test: spi_device_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: spi_device_sec_cm, uvm_test: spi_device_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: spi_device_stress_all, uvm_test: spi_device_stress_all, seeds: [1, 2], timeout: 3600}
