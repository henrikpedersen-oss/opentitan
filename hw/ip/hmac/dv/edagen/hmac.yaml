# hmac: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: hmac
clock_frequency_hz: 100000000
top: hmac
description: "hmac: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: hmac_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: main}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: hmac_ral_pkg
    ral_core: "lowrisc:dv:hmac_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/hmac/dv/hmac_sim_cfg.hjson
  reuse_core: "lowrisc:dv:hmac_sim:0.1"
  reuse_testplan: hw/ip/hmac/data/hmac_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: hmac_smoke, uvm_test: hmac_smoke, seeds: [1, 2], timeout: 3600}
  - {name: hmac_long_msg, uvm_test: hmac_long_msg, seeds: [1, 2], timeout: 3600}
  - {name: hmac_stress_reset, uvm_test: hmac_stress_reset, seeds: [1, 2], timeout: 3600}
  - {name: hmac_back_pressure, uvm_test: hmac_back_pressure, seeds: [1, 2], timeout: 3600}
  - {name: hmac_datapath_stress, uvm_test: hmac_datapath_stress, seeds: [1, 2], timeout: 3600}
  - {name: hmac_burst_wr, uvm_test: hmac_burst_wr, seeds: [1, 2], timeout: 3600}
  - {name: hmac_error, uvm_test: hmac_error, seeds: [1, 2], timeout: 3600}
  - {name: hmac_wipe_secret, uvm_test: hmac_wipe_secret, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_sha256_vectors, uvm_test: hmac_test_sha256_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_sha384_vectors, uvm_test: hmac_test_sha384_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_sha512_vectors, uvm_test: hmac_test_sha512_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_hmac256_vectors, uvm_test: hmac_test_hmac256_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_hmac384_vectors, uvm_test: hmac_test_hmac384_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_test_hmac512_vectors, uvm_test: hmac_test_hmac512_vectors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_stress_all, uvm_test: hmac_stress_all, seeds: [1, 2], timeout: 3600}
  - {name: hmac_stress_all_with_rand_reset, uvm_test: hmac_stress_all_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: hmac_directed, uvm_test: hmac_directed, seeds: [1, 2], timeout: 3600}
  - {name: hmac_csr_hw_reset, uvm_test: hmac_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: hmac_csr_rw, uvm_test: hmac_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: hmac_csr_bit_bash, uvm_test: hmac_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: hmac_csr_aliasing, uvm_test: hmac_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: hmac_same_csr_outstanding, uvm_test: hmac_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: hmac_csr_mem_rw_with_rand_reset, uvm_test: hmac_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: hmac_alert_test, uvm_test: hmac_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: hmac_intr_test, uvm_test: hmac_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: hmac_tl_errors, uvm_test: hmac_tl_errors, seeds: [1, 2], timeout: 3600}
  - {name: hmac_tl_intg_err, uvm_test: hmac_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: hmac_sec_cm, uvm_test: hmac_sec_cm, seeds: [1, 2], timeout: 3600}
