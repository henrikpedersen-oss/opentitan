# i3c: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: i3c
clock_frequency_hz: 100000000
top: i3c
description: "i3c: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: i3c_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:

resets:

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: i3c_ral_pkg
    ral_core: "lowrisc:dv:i3c_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/i3c/dv/i3c_sim_cfg.hjson
  reuse_core: "lowrisc:dv:i3c_sim:0.1"
  reuse_testplan: hw/ip/i3c/data/i3c_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: i3c_csr_hw_reset, uvm_test: i3c_csr_hw_reset, seeds: [1, 2], timeout: 3600}
  - {name: i3c_csr_rw, uvm_test: i3c_csr_rw, seeds: [1, 2], timeout: 3600}
  - {name: i3c_csr_bit_bash, uvm_test: i3c_csr_bit_bash, seeds: [1, 2], timeout: 3600}
  - {name: i3c_csr_aliasing, uvm_test: i3c_csr_aliasing, seeds: [1, 2], timeout: 3600}
  - {name: i3c_same_csr_outstanding, uvm_test: i3c_same_csr_outstanding, seeds: [1, 2], timeout: 3600}
  - {name: i3c_csr_mem_rw_with_rand_reset, uvm_test: i3c_csr_mem_rw_with_rand_reset, seeds: [1, 2], timeout: 3600}
  - {name: i3c_tl_intg_err, uvm_test: i3c_tl_intg_err, seeds: [1, 2], timeout: 3600}
  - {name: i3c_sec_cm, uvm_test: i3c_sec_cm, seeds: [1, 2], timeout: 3600}
  - {name: i3c_mem_walk, uvm_test: i3c_mem_walk, seeds: [1, 2], timeout: 3600}
  - {name: i3c_mem_partial_access, uvm_test: i3c_mem_partial_access, seeds: [1, 2], timeout: 3600}
  - {name: i3c_alert_test, uvm_test: i3c_alert_test, seeds: [1, 2], timeout: 3600}
  - {name: i3c_intr_test, uvm_test: i3c_intr_test, seeds: [1, 2], timeout: 3600}
  - {name: i3c_tl_errors, uvm_test: i3c_tl_errors, seeds: [1, 2], timeout: 3600}
