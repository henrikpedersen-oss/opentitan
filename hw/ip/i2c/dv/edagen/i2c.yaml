# i2c: a first edagen configuration, written by scripts/new_edagen_config.py from
# OpenTitan's data (the IP hjson, top_earlgrey.hjson, FuseSoC, the dv/ directory). NOT
# REVIEWED YET: check the clock groups (the chip clock behind each port), the resets' clocks,
# quasi-static inputs (formal.cdc_static), the DFT test mode (formal.dft) and the test seeds,
# as rv_dm.yaml and aes.yaml were checked.
module: i2c
clock_frequency_hz: 24000000
top: i2c
description: "i2c: its OpenTitan block bench (generated configuration, not reviewed)"
owner: Henrik Pedersen <henrik.pedersen@lowrisc.org>

rtl:
  filelist: i2c_rtl.f
  filelist_vars: {REPO: ../../../../..}

clocks:
  - {name: clk, port: clk_i, group: io_div4}

resets:
  - {name: rst, port: rst_ni, active_low: true, sync_to: clk}

interfaces:
  - name: regs
    kind: tl
    ports: {h2d: tl_i, d2h: tl_o}
    vip: lowrisc
    ral_package: i2c_ral_pkg
    ral_core: "lowrisc:dv:i2c_env:0.1"

alerts:
  - {name: fatal_fault, fatal: true, desc: "This fatal alert is triggered when a fatal TL-UL bus integrity fault is detected."}

dv:
  lowrisc_root: ../../../../..   # this tree, the EG2 fork; LOWRISC_ROOT= overrides it
  reuse_sim_cfg: hw/ip/i2c/dv/i2c_sim_cfg.hjson
  reuse_core: "lowrisc:dv:i2c_sim:0.1"
  reuse_testplan: hw/ip/i2c/data/i2c_testplan.hjson

synthesis:
  tech: nangate45
  liberty: ["${NANGATE45_DIR}/NangateOpenCellLibrary_typical.lib"]
  driving_cell: BUF_X2
  io_delay_pct: 20

tools:
  defaults: {simulator: xcelium, coverage: true, timescale: 1ns/1ps}
  xcelium: {version: "24.03"}
  vcs: {}
  imc: {version: "24.03"}
  jasper: {apps: [superlint, unr, cdc, fpv]}
  genus: {effort: medium}
  conformal: {netlist_from: genus}
  yosys: {frontend: slang, flatten: true}

# Every test of the reused sim cfg (and its imported common tests), seeds 1 and 2.
tests:
  - {name: i2c_host_smoke, uvm_test: i2c_host_smoke, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_override, uvm_test: i2c_host_override, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_watermark, uvm_test: i2c_host_fifo_watermark, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_overflow, uvm_test: i2c_host_fifo_overflow, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_reset_fmt, uvm_test: i2c_host_fifo_reset_fmt, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_fmt_empty, uvm_test: i2c_host_fifo_fmt_empty, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_reset_rx, uvm_test: i2c_host_fifo_reset_rx, seeds: [1, 2], timeout: 3600}
  - {name: i2c_host_fifo_full, uvm_test: i2c_host_fifo_full, seeds: [1, 2], timeout: 3600}
